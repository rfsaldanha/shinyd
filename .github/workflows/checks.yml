name: checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  go:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go test -race ./...
      - run: go build -o dist/shinyd ./cmd/shinyd
      - run: go build -o dist/shinyd-gateway ./cmd/shinyd-gateway
      - run: go build -o dist/shinyd-agent ./cmd/shinyd-agent
      - run: go build -o dist/shinyd-agentctl ./cmd/shinyd-agentctl
      - run: python3 scripts/agent_probe.py
  agent-package:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: python3 scripts/build_agent_package.py
      - name: Install and verify the service on this disposable runner
        run: |
          set -o pipefail
          sudo -n python3 scripts/agent_service_smoke.py --install-package 'dist/shinyd-agent_0.1.0~agent1_amd64.deb' | tee dist/agent-service-report.json
      - name: Verify removal preserves state
        run: |
          sudo -n touch /var/lib/shinyd/package-test-sentinel
          sudo -n dpkg --remove shinyd-agent
          sudo -n test -f /var/lib/shinyd/package-test-sentinel
          test ! -S /run/shinyd-agent/control.sock
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: agent-package-and-report
          path: |
            dist/*.deb
            dist/*.sha256
            dist/agent-service-report.json
  python:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.lock
      - run: pip install -r requirements.lock
      - run: ruff check backend tests scripts manage.py
      - run: ruff format --check backend tests scripts manage.py
      - run: pytest -q
      - run: python scripts/bootstrap.py
      - run: python manage.py migrate --noinput
        env:
          SHINYD_DEV: "1"
      - run: python manage.py makemigrations --check --dry-run
        env:
          SHINYD_DEV: "1"
      - run: python manage.py check --deploy --fail-level WARNING
